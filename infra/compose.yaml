name: dbportal-dev

# GOTCHA (found while wiring the semaphore service, WU-033): with `-f
# infra/compose.yaml` and no other flag, Compose's project directory
# defaults to THIS file's directory (infra/), so it looks for infra/.env —
# not repo-root .env — and every ${VAR:-default} below silently falls back
# to its default. This has been invisible for postgres/mailpit because their
# .env values happen to equal the hardcoded defaults; it is NOT invisible for
# semaphore (real admin password / access-key-encryption). Run with the repo
# root as the env source explicitly, e.g.:
#   docker compose -f infra/compose.yaml --env-file .env up -d --wait
# (root `npm run up` does not yet do this — worth a follow-up WU/idea in
# BACKLOG.md; out of blast radius for WU-033's infra scaffold).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PORTAL_DB_USER:-portal}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${PORTAL_DB_NAME:-portal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_DB_USER:-portal} -d ${PORTAL_DB_NAME:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP

  # WU-033 (SPEC-033 mini-ADR 7): real Ansible Semaphore engine, dev-only,
  # opt-in via PORTAL_ENGINE_NONPROD=semaphore. BoltDB dialect — no external
  # DB. Pinned to v2.17.39: `latest`/v2.18.x currently panics on boot with
  # BoltDB ("panic: unknown store type" in NewTerraformStore, a pro_impl
  # code path) — v2.17.39 boots clean with SEMAPHORE_DB_DIALECT=bolt.
  #
  # GOTCHA: on first boot Semaphore's setup wizard IGNORES
  # SEMAPHORE_ACCESS_KEY_ENCRYPTION and generates its own random
  # cookie_hash/cookie_encryption/access_key_encryption, persisted in
  # config.json under SEMAPHORE_CONFIG_PATH (/etc/semaphore). We still pass
  # the env var (matches upstream docs and future image versions that may
  # honor it), but durability of the REAL key comes from persisting
  # /etc/semaphore in a named volume, not from .env. Same applies to
  # SEMAPHORE_ADMIN/_PASSWORD/_NAME/_EMAIL: only consumed on the very first
  # boot (when config.json doesn't exist yet) to create the admin user in
  # BoltDB; a fresh admin is not re-created on restart.
  # WU-034 (SPEC-034 mini-ADR 2): build a runner image with postgresql-client
  # baked in (the non-root runner cannot apk-add at playbook time). BoltDB
  # state (project, templates, API token) lives in the named volumes below and
  # survives the image swap + container recreate. `image:` gives the built
  # image a stable local tag.
  semaphore:
    build:
      context: .
      dockerfile: semaphore.Dockerfile
    image: dbportal-semaphore:v2.17.39-pg16
    environment:
      SEMAPHORE_DB_DIALECT: bolt
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-change-me-dev-only}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Portal Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@db-portal.local}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - semaphore_data:/var/lib/semaphore     # BoltDB (tasks, projects, users, …)
      - semaphore_config:/etc/semaphore       # config.json (holds the REAL, generated encryption keys)
      - ../playbooks:/playbooks               # local "repository" for Semaphore — see infra/semaphore-bootstrap.sh
      - artifacts:/artifacts                  # WU-034: dump output volume (staging; WU-035 moves bytes to minio)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # WU-035 (SPEC-035): S3-compatible object store — the real home for dump
  # artifact bytes (O-1). The dump playbook uploads here via `mc` after the
  # checksum; the `artifacts` volume becomes staging only. Reachable by the
  # Semaphore runner on the compose network as minio:9000 (creds injected
  # engine-side into the "pgtarget-env" Environment as MC_HOST_dbportal by
  # infra/semaphore-bootstrap.sh — ADR-004; the portal never sees them and
  # never touches object bytes, mini-ADR 1). The official minio image is a
  # minimal (shell-less, curl-less) image, so it carries NO compose
  # healthcheck; the `createbuckets` one-shot below is the readiness gate (its
  # retry loop waits for minio to accept connections, then exits 0).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-dev-only}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - miniodata:/data

  # WU-035: create the artifact bucket idempotently on stack up. minio/mc has a
  # shell; it waits for minio (retry loop — minio has no healthcheck) then
  # `mc mb --ignore-existing`. Runs to completion (exit 0); `--wait` is
  # satisfied by the clean exit. `$$VAR` escapes compose interpolation so the
  # shell expands the injected env at runtime.
  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-dev-only}
      DBPORTAL_BUCKET: ${DBPORTAL_BUCKET:-dbportal-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio ..."; sleep 1;
        done
        mc mb --ignore-existing "local/$$DBPORTAL_BUCKET"
        echo "bucket ready: $$DBPORTAL_BUCKET"
    restart: "no"

  # WU-034 (SPEC-034): a real Postgres for the dump playbook to back up.
  # Reachable by the Semaphore runner on the compose network as pgtarget:5432
  # (creds are injected engine-side into the Semaphore "pgtarget-env"
  # Environment by infra/semaphore-bootstrap.sh — ADR-004; the portal never
  # sees them). Seeded once on the fresh pgtargetdata volume via the init
  # script. Host port 5433 (5432 is the portal DB) for drill-side inspection.
  pgtarget:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGTARGET_DB_USER:-appuser}
      POSTGRES_PASSWORD: ${PGTARGET_DB_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${PGTARGET_DB_NAME:-appdb}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgtargetdata:/var/lib/postgresql/data
      - ./fixtures/pgtarget-init.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGTARGET_DB_USER:-appuser} -d ${PGTARGET_DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  semaphore_data:
  semaphore_config:
  artifacts:
  pgtargetdata:
  miniodata:
