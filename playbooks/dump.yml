---
# WU-034 (SPEC-034): the first REAL operation — pg_dump -Fc of a Postgres
# target, executed by the Semaphore runner (hosts: localhost, connection:
# local), producing a restorable artifact on the shared /artifacts volume.
#
# CREDENTIALS (ADR-004): this playbook names NO credential. The target
# connection comes entirely from libpq environment variables (PGHOST/PGPORT/
# PGUSER/PGPASSWORD/PGDATABASE) that the Semaphore "pgtarget-env" Environment
# injects into the process — pg_dump reads them automatically. Nothing secret
# is referenced here, so nothing secret can leak into task output.
#
# RESULT CONTRACT (SPEC-034 mini-ADR 4): the last task emits exactly one line
#   DBPORTAL_RESULT=<base64 of {"name","size_bytes","sha256","location"}>
# which the SemaphoreAdapter parses into engine.Artifact. base64 survives
# Ansible's debug-callback quote-escaping intact.

- name: db-portal dump
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    artifact_dir: /artifacts
    # WU-035 (SPEC-035): object-store target. The bucket name is not a secret;
    # the credentialed alias lives ONLY in the Semaphore Environment as
    # MC_HOST_dbportal, which `mc` reads from its process environment (ADR-004,
    # mini-ADR 4) — this playbook names no credential.
    mc_alias: dbportal
    bucket: "{{ lookup('env', 'DBPORTAL_BUCKET') | default('dbportal-artifacts', true) }}"

  tasks:
    # Fail honestly (not cryptically inside pg_dump) if the Environment that
    # carries the connection wasn't wired. PGHOST/PGDATABASE are not secrets.
    - name: preflight — target connection is configured
      ansible.builtin.assert:
        that:
          - "lookup('env', 'PGHOST') | length > 0"
          - "lookup('env', 'PGDATABASE') | length > 0"
        fail_msg: >-
          target connection not configured — the Semaphore Environment
          (PGHOST/PGDATABASE/…) is missing. See infra/semaphore-bootstrap.sh.
        quiet: true

    # Freeze the artifact name ONCE: now()/random are lazy Jinja — referenced
    # in `vars:` they re-evaluate on every use, so pg_dump's --file and the
    # later stat would compute DIFFERENT names. set_fact pins a static string.
    - name: freeze artifact name
      ansible.builtin.set_fact:
        artifact_name: "{{ (lookup('env', 'PGDATABASE') | default('target', true)) }}-{{ now(true, '%Y%m%dT%H%M%SZ') }}-{{ 99999999 | random }}.dump"
    - name: derive artifact path
      ansible.builtin.set_fact:
        artifact_path: "{{ artifact_dir }}/{{ artifact_name }}"

    - name: run pg_dump (custom format, portable)
      ansible.builtin.command:
        argv:
          - pg_dump
          - --format=custom
          - --no-owner
          - --no-privileges
          - --file={{ artifact_path }}
      changed_when: true

    - name: stat the dump (size + sha256)
      ansible.builtin.stat:
        path: "{{ artifact_path }}"
        checksum_algorithm: sha256
      register: dumpstat

    - name: preflight — the dump is non-empty
      ansible.builtin.assert:
        that:
          - dumpstat.stat.exists
          - dumpstat.stat.size > 0
        fail_msg: "pg_dump produced no output at {{ artifact_path }}"
        quiet: true

    # WU-035 (SPEC-035 mini-ADR 3): store the bytes in object storage. mc reads
    # the credentialed MC_HOST_dbportal alias from the process environment
    # (injected engine-side by the Semaphore Environment — no credential named
    # here). A non-zero mc exit ABORTS the play: a dump that isn't stored must
    # never reach the emit step, so it registers no artifact.
    - name: upload the dump to object storage
      ansible.builtin.command:
        argv:
          - mc
          - cp
          - "{{ artifact_path }}"
          - "{{ mc_alias }}/{{ bucket }}/{{ artifact_name }}"
      changed_when: true

    - name: stat the stored object
      ansible.builtin.command:
        argv:
          - mc
          - stat
          - --json
          - "{{ mc_alias }}/{{ bucket }}/{{ artifact_name }}"
      register: mcstat
      changed_when: false

    - name: preflight — stored object size matches the local dump
      ansible.builtin.assert:
        that:
          - (mcstat.stdout | from_json).size | int == dumpstat.stat.size
        fail_msg: >-
          stored object size {{ (mcstat.stdout | from_json).size | default('?') }}
          != dumped file size {{ dumpstat.stat.size }} — upload not verified
        quiet: true

    # Only now that the bytes are stored AND verified do we announce the
    # artifact. location is the canonical object URL (mini-ADR 2), NOT the
    # staging path — the volume is staging only from WU-035 on.
    - name: emit machine-readable result line
      ansible.builtin.debug:
        msg: >-
          DBPORTAL_RESULT={{
            {
              'name': artifact_name,
              'size_bytes': dumpstat.stat.size,
              'sha256': dumpstat.stat.checksum,
              'location': 's3://' ~ bucket ~ '/' ~ artifact_name
            } | to_json | b64encode }}

    # Staging cleanup (mini-ADR 5): the object store is the source of truth now;
    # the local .dump was only a staging copy pg_dump had to write before mc
    # could upload it. Best-effort — a cleanup failure must NOT fail a run whose
    # artifact is already stored and announced.
    - name: staging cleanup — remove the local dump
      ansible.builtin.file:
        path: "{{ artifact_path }}"
        state: absent
      failed_when: false
